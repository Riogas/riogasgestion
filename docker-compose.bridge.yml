version: '3.9'

services:
  # ============================================
  # Aplicación Next.js - CON RED BRIDGE
  # ============================================
  riogasgestion:
    container_name: riogasgestion-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: riogasgestion:latest
    restart: unless-stopped
    
    # Puerto expuesto
    ports:
      - "3000:3000"
    
    # Variables de entorno
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    
    # Archivo de variables de entorno
    env_file:
      - .env.production
    
    # Volúmenes persistentes
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    
    # Networking con mapeo de host
    networks:
      - riogasgestion-network
    
    # Mapear el host backend a la IP
    extra_hosts:
      - "backend.riogas:192.168.1.72"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# Red personalizada con acceso al host
# ============================================
networks:
  riogasgestion-network:
    driver: bridge
    name: riogasgestion-network
    driver_opts:
      com.docker.network.bridge.name: br-riogasgestion
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
